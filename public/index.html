<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LLM Chat App</title>
		<style>
			:root {
				color-scheme: dark;
				--primary-color: #f6821f;
				--primary-hover: #ff9b4a;
				--page-bg: #0b0d10;
				--surface: #15181d;
				--surface-raised: #1c2026;
				--light-bg: #101318;
				--border-color: #343a43;
				--text-color: #f3f4f6;
				--text-light: #a7adb7;
				--user-msg-bg: #4a2815;
				--assistant-msg-bg: #20242b;
				--control-bg: #111419;
			}

			:root[data-theme="light"] {
				color-scheme: light;
				--primary-color: #d95f02;
				--primary-hover: #bd5200;
				--page-bg: #ffffff;
				--surface: #ffffff;
				--surface-raised: #ffffff;
				--light-bg: #f9fafb;
				--border-color: #e5e7eb;
				--text-color: #1f2937;
				--text-light: #6b7280;
				--user-msg-bg: #fff2e6;
				--assistant-msg-bg: #f3f4f6;
				--control-bg: #ffffff;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
				line-height: 1.6;
				color: var(--text-color);
				background: var(--page-bg);
				transition: background-color 0.2s ease, color 0.2s ease;
				max-width: 800px;
				margin: 0 auto;
				padding: 1rem;
			}

			header {
				position: relative;
				text-align: center;
				margin-bottom: 2rem;
				padding: 1rem 3.5rem;
				border-bottom: 1px solid var(--border-color);
			}

			#theme-toggle {
				position: absolute;
				right: 0;
				top: 50%;
				transform: translateY(-50%);
				width: 42px;
				height: 42px;
				border: 1px solid var(--border-color);
				border-radius: 999px;
				background: var(--surface-raised);
				color: var(--text-color);
				cursor: pointer;
				font-size: 1.1rem;
			}

			#theme-toggle:hover {
				border-color: var(--primary-color);
			}

			#theme-toggle:focus-visible,
			#model-preference:focus-visible,
			#user-input:focus-visible,
			#send-button:focus-visible {
				outline: 2px solid var(--primary-color);
				outline-offset: 2px;
			}

			h1 {
				font-size: 1.5rem;
				color: var(--primary-color);
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 200px);
				min-height: 400px;
				border: 1px solid var(--border-color);
				border-radius: 8px;
				overflow: hidden;
				background: var(--surface);
				box-shadow: 0 20px 60px rgb(0 0 0 / 0.25);
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				background-color: var(--light-bg);
			}

			.message {
				margin-bottom: 1rem;
				padding: 0.75rem;
				border-radius: 8px;
				max-width: 80%;
			}

			.message p {
				white-space: pre-line;
				margin: 0;
				overflow-wrap: anywhere;
			}

			.user-message {
				background-color: var(--user-msg-bg);
				align-self: flex-end;
				margin-left: auto;
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				align-self: flex-start;
			}

			.message-input {
				display: grid;
				grid-template-columns: auto 1fr auto;
				gap: 0.5rem;
				align-items: end;
				padding: 0.75rem;
				border-top: 1px solid var(--border-color);
				background-color: var(--surface);
			}

			.model-picker {
				display: flex;
				flex-direction: column;
				gap: 0.2rem;
				font-size: 0.75rem;
				color: var(--text-light);
			}

			#model-preference {
				min-height: 44px;
				padding: 0.5rem;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				background: var(--control-bg);
				color: var(--text-color);
			}

			#user-input {
				flex: 1;
				padding: 0.75rem;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-family: inherit;
				resize: none;
				min-height: 44px;
				background: var(--control-bg);
				color: var(--text-color);
			}

			#send-button {
				min-height: 44px;
				padding: 0 1.15rem;
				background-color: var(--primary-color);
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			#send-button:hover {
				background-color: var(--primary-hover);
			}

			#send-button:disabled {
				background-color: var(--text-light);
				cursor: not-allowed;
			}

			.typing-indicator {
				display: none;
				font-style: italic;
				color: var(--text-light);
				padding: 1rem;
			}

			.typing-indicator.visible {
				display: block;
			}

			footer {
				margin-top: 1rem;
				text-align: center;
				font-size: 0.85rem;
				color: var(--text-light);
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Cloudflare AI Chat</h1>
			<p>Protected by Access · Governed by AI Gateway</p>
			<button
				id="theme-toggle"
				type="button"
				aria-label="Switch to light mode"
				title="Switch to light mode"
			>☀️</button>
		</header>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>
						Hello! I'm an LLM chat app powered by Cloudflare Workers AI. How can
						I help you today?
					</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI is thinking...
			</div>

			<div class="message-input">
				<label class="model-picker" for="model-preference">
					Model
					<select id="model-preference">
						<option value="default">Company default</option>
						<option value="openai">OpenAI (GPT-4o mini)</option>
					</select>
				</label>
				<textarea
					id="user-input"
					placeholder="Type your message here..."
					rows="1"
					autofocus
				></textarea>
				<button id="send-button">Send</button>
			</div>
		</div>

		<footer>
			<p>Cloudflare Workers AI Chat Template &copy; 2025</p>
		</footer>

		<!-- Chat app script -->
		<script src="chat.js"></script>
	</body>
</html>
